[package]
name = "ebyte-e32"
version = "0.10.0"
edition = "2021"
description = "Platform-agnostic driver for Ebyte E32 LoRa modules"
license-file = "LICENSE"
repository = "https://github.com/barafael/ebyte-e32-rs"

[features]
value_enum = ["dep:clap", "snafu/std"]

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
proptest = "1"
proptest-derive = "0.4"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
embedded-hal = "1"
embedded-hal-nb = "1"
mutants = "0.0.4"
nb = "1"
snafu = { version = "0.8", features = [
    "rust_1_61",
], default-features = false }
typed-builder = "0.23"
